<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCRH - Monthly Report</title>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary:#C8102E;
            --primary-gradient:linear-gradient(135deg,#C8102E 0%,#e81a3f 100%);
            --primary-soft:rgba(200,16,46,0.08);
            --bg:#f4f6fb;
            --card:#fff;
            --card-alt:#fafbfd;
            --border:#e8ebf1;
            --border-soft:#f1f4f9;
            --text:#0f172a;
            --text-soft:#475569;
            --text-muted:#94a3b8;
            --success:#10b981;
            --success-soft:#d1fae5;
            --success-text:#047857;
            --warning:#f59e0b;
            --warning-soft:#fef3c7;
            --warning-text:#b45309;
            --danger:#ef4444;
            --danger-soft:#fee2e2;
            --danger-text:#b91c1c;
            --info:#0ea5e9;
            --info-soft:#e0f2fe;
            --info-text:#0369a1;
            --radius:14px;
            --radius-sm:10px;
            --shadow-sm:0 1px 3px rgba(15,23,42,0.04);
            --shadow:0 4px 14px rgba(15,23,42,0.06);
            --shadow-lg:0 20px 60px rgba(15,23,42,0.1);
            --transition:200ms cubic-bezier(0.4,0,0.2,1);
            --transition-slow:320ms cubic-bezier(0.4,0,0.2,1);
            --sidebar-width:240px;
            --sidebar-collapsed:68px;
        }

        [data-theme="dark"] {
            --bg:#0b1220;
            --card:#131c30;
            --card-alt:#1a2540;
            --border:rgba(255,255,255,0.08);
            --border-soft:rgba(255,255,255,0.04);
            --text:#f1f5f9;
            --text-soft:#cbd5e1;
            --text-muted:#94a3b8;
            --success-soft:rgba(16,185,129,0.15);
            --success-text:#6ee7b7;
            --warning-soft:rgba(245,158,11,0.15);
            --warning-text:#fcd34d;
            --danger-soft:rgba(239,68,68,0.15);
            --danger-text:#fca5a5;
            --info-soft:rgba(14,165,233,0.15);
            --info-text:#7dd3fc;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.4);
            --shadow:0 4px 14px rgba(0,0,0,0.4);
            --shadow-lg:0 20px 60px rgba(0,0,0,0.6);
        }

        html, body { transition: background-color var(--transition-slow), color var(--transition-slow); }
        body { font-family:'Plus Jakarta Sans','Inter',sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; opacity:0; transition: opacity 320ms ease; }
        body.page-ready { opacity:1; }
        body.page-leaving { opacity:0; }

        .app-shell { display:flex; min-height:100vh; }

        /* SIDEBAR */
        .sidebar {
            width:var(--sidebar-width);
            background:linear-gradient(180deg,#1a1a2e 0%,#0f172a 100%);
            color:white;
            display:flex;
            flex-direction:column;
            position:fixed;
            top:0; left:0; bottom:0;
            z-index:100;
            transition:width var(--transition);
            overflow:hidden;
        }
        [data-theme="dark"] .sidebar { background:linear-gradient(180deg,#0a0f1c 0%,#070b14 100%); }
        .sidebar.collapsed { width:var(--sidebar-collapsed); }
        .sidebar.collapsed .sidebar-title,
        .sidebar.collapsed .nav-item span,
        .sidebar.collapsed .nav-section-title,
        .sidebar.collapsed .user-chip-info { display:none; }
        .sidebar.collapsed .nav-item { justify-content:center; padding:11px 8px; }
        .sidebar.collapsed .user-chip { justify-content:center; padding:10px 6px; }

        .sidebar-header {
            padding:20px 18px;
            border-bottom:1px solid rgba(255,255,255,0.08);
            display:flex;
            align-items:center;
            gap:12px;
            flex-shrink:0;
            position:relative;
        }
        .sidebar.collapsed .sidebar-header { justify-content:center; padding:20px 10px; }
        .sidebar-logo {
            width:38px; height:38px;
            background:var(--primary-gradient);
            border-radius:10px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:800;
            font-size:17px;
            flex-shrink:0;
            box-shadow:0 4px 12px rgba(200,16,46,0.4);
        }
        .sidebar-title { font-weight:700; font-size:14px; line-height:1.2; white-space:nowrap; }
        .sidebar-title small { font-size:10.5px; color:rgba(255,255,255,0.5); font-weight:500; display:block; }
        .sidebar-collapse-btn {
            position:absolute;
            right:-12px;
            top:50%;
            transform:translateY(-50%);
            width:24px; height:24px;
            background:#1a2540;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:50%;
            color:white;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:10px;
            transition:var(--transition);
            z-index:10;
        }
        .sidebar-collapse-btn:hover { background:var(--primary); transform:translateY(-50%) scale(1.1); }
        .sidebar.collapsed .sidebar-collapse-btn i { transform:rotate(180deg); }

        .sidebar-nav { flex:1; padding:14px 10px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
        .nav-section-title {
            font-size:10px;
            text-transform:uppercase;
            letter-spacing:0.8px;
            color:rgba(255,255,255,0.4);
            padding:10px 12px 6px;
            font-weight:700;
        }
        .nav-item {
            display:flex;
            align-items:center;
            gap:12px;
            padding:11px 14px;
            border-radius:10px;
            color:rgba(255,255,255,0.75);
            cursor:pointer;
            font-size:13.5px;
            font-weight:600;
            transition:var(--transition);
            border:none;
            background:transparent;
            width:100%;
            text-align:left;
            font-family:inherit;
            text-decoration:none;
            white-space:nowrap;
        }
        .nav-item i { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
        .nav-item:hover { background:rgba(255,255,255,0.06); color:white; }
        .nav-item.active { background:var(--primary-gradient); color:white; box-shadow:0 4px 12px rgba(200,16,46,0.35); }

        .sidebar-footer { padding:14px 10px; border-top:1px solid rgba(255,255,255,0.08); flex-shrink:0; }
        .user-chip {
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px 12px;
            border-radius:10px;
            background:rgba(255,255,255,0.05);
            margin-bottom:8px;
        }
        .user-avatar {
            width:34px; height:34px;
            border-radius:50%;
            background:var(--primary-gradient);
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:700;
            font-size:13px;
            flex-shrink:0;
        }
        .user-chip-info { flex:1; min-width:0; }
        .user-chip-info .name { font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .user-chip-info .role { font-size:10px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }

        /* MAIN */
        .main-area {
            flex:1;
            margin-left:var(--sidebar-width);
            display:flex;
            flex-direction:column;
            min-height:100vh;
            transition:margin-left var(--transition);
        }
        .sidebar.collapsed ~ .main-area { margin-left:var(--sidebar-collapsed); }

        .topbar {
            background:var(--card);
            border-bottom:1px solid var(--border);
            padding:14px 24px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            position:sticky;
            top:0;
            z-index:50;
            box-shadow:var(--shadow-sm);
        }
        .topbar-left { display:flex; align-items:center; gap:14px; min-width:0; }
        .menu-toggle {
            display:none;
            background:var(--bg);
            border:1px solid var(--border);
            width:38px; height:38px;
            border-radius:10px;
            cursor:pointer;
            color:var(--text);
            font-size:15px;
        }
        .page-title h1 { font-size:18px; font-weight:800; letter-spacing:-0.3px; }
        .page-title small { font-size:12px; color:var(--text-muted); font-weight:500; }
        .topbar-actions { display:flex; gap:8px; align-items:center; flex-shrink:0; }

        .theme-toggle {
            width:38px; height:38px;
            border-radius:10px;
            border:1.5px solid var(--border);
            background:var(--card);
            color:var(--text-soft);
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:14px;
            transition:var(--transition);
        }
        .theme-toggle:hover { border-color:var(--primary); color:var(--primary); transform:rotate(15deg); }
        .theme-toggle i { transition:transform 400ms cubic-bezier(0.4,0,0.2,1); }
        [data-theme="dark"] .theme-toggle i.fa-moon { transform:rotate(360deg); }

        /* BREADCRUMBS */
        .breadcrumbs {
            display:flex;
            align-items:center;
            gap:8px;
            font-size:12px;
            font-weight:600;
            color:var(--text-muted);
            padding:0 24px;
            margin-top:12px;
            opacity:0;
            animation:fadeInUp 400ms ease 150ms forwards;
        }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
        .breadcrumbs a { color:var(--text-muted); text-decoration:none; transition:var(--transition); display:flex; align-items:center; gap:6px; }
        .breadcrumbs a:hover { color:var(--primary); }
        .breadcrumbs i.chevron { font-size:9px; opacity:0.5; }
        .breadcrumbs .current { color:var(--text); font-weight:700; }

        /* BUTTONS */
        .btn {
            padding:9px 16px;
            border:none;
            border-radius:10px;
            font-weight:700;
            font-size:12.5px;
            cursor:pointer;
            transition:var(--transition);
            display:inline-flex;
            align-items:center;
            gap:7px;
            font-family:inherit;
            text-decoration:none;
            white-space:nowrap;
            position:relative;
            overflow:hidden;
        }
        .btn i { font-size:12px; z-index:1; position:relative; }
        .btn > * { z-index:1; position:relative; }
        .btn::before {
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.28), transparent 70%);
            transform:translateX(-100%);
            transition:600ms ease;
            pointer-events:none;
        }
        .btn:hover:not(:disabled)::before { transform:translateX(100%); }
        .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,0.55); transform:scale(0); animation:rippleExpand 620ms cubic-bezier(0.4,0,0.2,1); pointer-events:none; }
        @keyframes rippleExpand { to { transform:scale(3); opacity:0; } }
        .btn-outline .ripple { background:rgba(200,16,46,0.15); }
        .btn-primary { background:var(--primary-gradient); color:white; box-shadow:0 4px 12px rgba(200,16,46,0.28); }
        .btn-primary:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 16px rgba(200,16,46,0.36); }
        .btn-success { background:linear-gradient(135deg,#10b981,#22c55e); color:white; box-shadow:0 4px 12px rgba(16,185,129,0.25); }
        .btn-success:hover:not(:disabled) { transform:translateY(-1px); }
        .btn-outline { background:var(--card); border:1.5px solid var(--border); color:var(--text-soft); }
        .btn-outline:hover:not(:disabled) { border-color:var(--primary); color:var(--primary); background:var(--primary-soft); }
        .btn-sm { padding:8px 14px; font-size:12px; }

        .content { padding:20px 24px 40px; flex:1; max-width:1100px; width:100%; margin:0 auto; }

        /* FILTERS */
        .filter-card {
            background:var(--card);
            border-radius:var(--radius);
            padding:16px 20px;
            border:1px solid var(--border);
            box-shadow:var(--shadow-sm);
            margin-bottom:18px;
            display:flex;
            flex-wrap:wrap;
            gap:14px;
            align-items:end;
            opacity:0;
            animation:fadeInUp 400ms cubic-bezier(0.16,1,0.3,1) 100ms forwards;
        }
        .filter-field { display:flex; flex-direction:column; gap:6px; }
        .filter-field label { font-size:11px; font-weight:700; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.4px; }
        .filter-field input {
            padding:10px 14px;
            border:1.5px solid var(--border);
            border-radius:10px;
            font-size:13px;
            font-family:inherit;
            background:var(--bg);
            outline:none;
            font-weight:500;
            color:var(--text);
            transition:var(--transition);
        }
        .filter-field input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(200,16,46,0.08); background:var(--card); }

        /* STATS */
        .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; margin-bottom:18px; }
        .stat-tile {
            background:var(--card);
            border-radius:var(--radius-sm);
            padding:16px 18px;
            border:1px solid var(--border);
            box-shadow:var(--shadow-sm);
            position:relative;
            overflow:hidden;
            opacity:0;
            animation:fadeInUp 400ms cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .stat-tile:nth-child(1) { animation-delay:140ms; }
        .stat-tile:nth-child(2) { animation-delay:180ms; }
        .stat-tile:nth-child(3) { animation-delay:220ms; }
        .stat-tile:nth-child(4) { animation-delay:260ms; }
        .stat-tile:nth-child(5) { animation-delay:300ms; }
        .stat-tile::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--primary); }
        .stat-tile .value { font-size:22px; font-weight:800; color:var(--text); font-family:'Inter',sans-serif; letter-spacing:-0.4px; }
        .stat-tile .label { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; margin-top:3px; }
        .stat-tile.success::before { background:#10b981; }
        .stat-tile.warning::before { background:#f59e0b; }
        .stat-tile.danger::before { background:#ef4444; }
        .stat-tile.info::before { background:#0ea5e9; }

        /* JOB LIST */
        .job-card-list {
            background:var(--card);
            border-radius:var(--radius);
            border:1px solid var(--border);
            box-shadow:var(--shadow-sm);
            padding:20px 22px;
            opacity:0;
            animation:fadeInUp 400ms cubic-bezier(0.16,1,0.3,1) 340ms forwards;
        }
        .job-card-list h3 { font-size:14px; font-weight:800; margin-bottom:14px; }

        .job-item {
            border:1px solid var(--border-soft);
            padding:14px 16px;
            margin-bottom:10px;
            border-radius:12px;
            transition:var(--transition);
            background:var(--card-alt);
        }
        .job-item:hover { background:var(--border-soft); border-color:var(--border); transform:translateX(2px); }
        .job-item .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:10px; }
        .job-item .row strong { color:var(--text); font-size:13.5px; font-weight:800; }
        .job-item .meta { font-size:12.5px; color:var(--text-soft); font-weight:500; }
        .job-item .meta + .meta { margin-top:3px; }

        .status-badge { padding:4px 11px; border-radius:20px; font-size:10.5px; font-weight:800; display:inline-flex; align-items:center; gap:4px; text-transform:uppercase; letter-spacing:0.3px; }
        .status-badge.pending { background:var(--warning-soft); color:var(--warning-text); }
        .status-badge.completed { background:var(--success-soft); color:var(--success-text); }
        .status-badge.writtenoff { background:var(--danger-soft); color:var(--danger-text); }
        .status-badge.postponed { background:var(--warning-soft); color:var(--warning-text); }

        /* AI REPORT */
        .ai-report {
            background:linear-gradient(135deg, var(--card-alt), var(--border-soft));
            padding:20px 22px;
            border-radius:var(--radius);
            margin-top:18px;
            border-left:4px solid var(--primary);
            border-top:1px solid var(--border);
            border-right:1px solid var(--border);
            border-bottom:1px solid var(--border);
            opacity:0;
            animation:fadeInUp 400ms cubic-bezier(0.16,1,0.3,1) 400ms forwards;
        }
        .ai-report h3 { color:var(--primary); margin-bottom:10px; font-size:14px; font-weight:800; display:flex; align-items:center; gap:8px; }
        .ai-report #aiText { font-size:13.5px; line-height:1.7; color:var(--text-soft); font-weight:500; white-space:pre-wrap; }
        .hidden { display:none; }

        /* EMPTY */
        .empty { text-align:center; padding:40px 20px; color:var(--text-muted); font-weight:600; font-size:13px; }
        .empty i { font-size:42px; display:block; margin-bottom:12px; opacity:0.25; }

        /* SKELETON */
        .skeleton {
            background:linear-gradient(90deg, var(--border-soft) 25%, var(--border) 50%, var(--border-soft) 75%);
            background-size:200% 100%;
            animation:shimmer 1.4s infinite;
            border-radius:8px;
        }
        [data-theme="dark"] .skeleton {
            background:linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
            background-size:200% 100%;
        }
        @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
        .skeleton-tile { height:80px; border-radius:var(--radius-sm); }
        .skeleton-item { height:76px; border-radius:12px; margin-bottom:10px; }

        /* TOAST */
        .toast {
            position:fixed;
            bottom:24px; right:24px;
            background:var(--card);
            color:var(--text);
            padding:14px 52px 14px 18px;
            border-radius:12px;
            font-weight:600;
            z-index:9999;
            transform:translateY(120px) scale(0.95);
            opacity:0;
            transition:480ms cubic-bezier(0.34,1.56,0.64,1);
            border:1px solid var(--border);
            border-left:4px solid var(--primary);
            max-width:420px;
            box-shadow:var(--shadow-lg);
            font-size:13px;
            display:flex;
            align-items:center;
            gap:12px;
            min-width:280px;
        }
        .toast.show { transform:translateY(0) scale(1); opacity:1; }
        .toast-icon {
            width:32px; height:32px;
            border-radius:9px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:14px;
            flex-shrink:0;
            background:var(--primary-soft);
            color:var(--primary);
        }
        .toast-body { flex:1; min-width:0; }
        .toast-title { font-weight:800; font-size:13px; color:var(--text); }
        .toast-message { font-size:12.5px; color:var(--text-soft); margin-top:1px; }
        .toast-close {
            position:absolute;
            top:10px; right:10px;
            width:22px; height:22px;
            border-radius:6px;
            background:transparent;
            border:none;
            color:var(--text-muted);
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:11px;
        }
        .toast-close:hover { background:var(--border-soft); color:var(--text); }
        .toast.success { border-left-color:var(--success); }
        .toast.success .toast-icon { background:var(--success-soft); color:var(--success); }
        .toast.error { border-left-color:var(--danger); }
        .toast.error .toast-icon { background:var(--danger-soft); color:var(--danger); }
        .toast.warning { border-left-color:var(--warning); }
        .toast.warning .toast-icon { background:var(--warning-soft); color:var(--warning); }
        .toast.info { border-left-color:var(--info); }
        .toast.info .toast-icon { background:var(--info-soft); color:var(--info); }

        /* BACKDROP */
        .sidebar-backdrop {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(15,23,42,0.5);
            z-index:99;
            opacity:0;
            transition:opacity var(--transition);
        }

        /* RESPONSIVE */
        @media (max-width:1024px) {
            .sidebar { transform:translateX(-100%); transition:transform var(--transition); }
            .sidebar.open { transform:translateX(0); }
            .sidebar.collapsed { width:var(--sidebar-width); }
            .sidebar.collapsed .sidebar-title,
            .sidebar.collapsed .nav-item span,
            .sidebar.collapsed .nav-section-title,
            .sidebar.collapsed .user-chip-info { display:block; }
            .sidebar.collapsed .nav-item { justify-content:flex-start; padding:11px 14px; }
            .main-area, .sidebar.collapsed ~ .main-area { margin-left:0; }
            .sidebar-collapse-btn { display:none; }
            .menu-toggle { display:flex; align-items:center; justify-content:center; }
            .sidebar-backdrop.show { display:block; opacity:1; }
        }
        @media (max-width:640px) {
            .content { padding:16px; }
            .topbar { padding:12px 16px; }
            .breadcrumbs { padding:0 16px; }
            .topbar-actions .btn span { display:none; }
            .toast { left:16px; right:16px; bottom:16px; max-width:none; }
        }

        ::-webkit-scrollbar { width:8px; height:8px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--text-muted); }
    </style>
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">M</div>
            <div class="sidebar-title">MCRH<small>Maintenance</small></div>
            <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="Collapse">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Overview</div>
            <a class="nav-item" href="dashboard.html"><i class="fas fa-clipboard-list"></i><span>Requests</span></a>
            <a class="nav-item" href="dashboard.html"><i class="fas fa-tools"></i><span>Jobcards</span></a>
            <div class="nav-section-title">Reports</div>
            <a class="nav-item" href="analytics.html"><i class="fas fa-chart-bar"></i><span>Analytics</span></a>
            <a class="nav-item active" href="report.html"><i class="fas fa-file-alt"></i><span>Monthly Report</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-chip">
                <div class="user-avatar" id="avatarInitial">U</div>
                <div class="user-chip-info">
                    <div class="name" id="sidebarUserName">User</div>
                    <div class="role" id="sidebarUserRole">role</div>
                </div>
            </div>
            <button class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <div class="main-area">
        <div class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div class="page-title">
                    <h1>Monthly Report</h1>
                    <small>Monthly maintenance summary</small>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn btn-outline btn-sm" onclick="navigateTo('dashboard.html')"><i class="fas fa-arrow-left"></i> <span>Back</span></button>
                <button class="btn btn-success btn-sm" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> <span>Export</span></button>
            </div>
        </div>

        <div class="breadcrumbs">
            <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
            <i class="fas fa-chevron-right chevron"></i>
            <span class="current">Monthly Report</span>
        </div>

        <div class="content">
            <div class="filter-card">
                <div class="filter-field">
                    <label>Month</label>
                    <input type="month" id="reportMonth" />
                </div>
                <button class="btn btn-primary" onclick="generateReport()"><i class="fas fa-sync-alt"></i> Generate</button>
                <button class="btn btn-outline" id="aiBtn" onclick="generateAIReport()"><i class="fas fa-robot"></i> AI Summary</button>
            </div>

            <div id="reportContent">
                <div class="stats-row" id="summaryStats"></div>
                <div class="job-card-list" id="jobCardsList"><div class="empty"><i class="fas fa-chart-line"></i>Select a month and click Generate.</div></div>
                <div id="aiReportContainer" class="ai-report hidden">
                    <h3><i class="fas fa-robot"></i> AI-Generated Summary</h3>
                    <div id="aiText">Loading…</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast">
    <div class="toast-icon" id="toastIcon"><i class="fas fa-info"></i></div>
    <div class="toast-body">
        <div class="toast-title" id="toastTitle">Message</div>
        <div class="toast-message" id="toastMessage"></div>
    </div>
    <button class="toast-close" onclick="hideToast()"><i class="fas fa-times"></i></button>
</div>

<script type="module">
    // ============ PAGE TRANSITION ============
    window.addEventListener('DOMContentLoaded', () => {
        requestAnimationFrame(() => document.body.classList.add('page-ready'));
    });
    window.navigateTo = function(url) {
        document.body.classList.remove('page-ready');
        document.body.classList.add('page-leaving');
        setTimeout(() => window.location.href = url, 220);
    };
    document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href$=".html"]');
        if (a && !a.target && !a.href.startsWith('mailto:') && !a.hasAttribute('data-no-transition')) {
            e.preventDefault();
            navigateTo(a.getAttribute('href'));
        }
    });

    // ============ THEME ============
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const toggle = document.getElementById('themeToggle');
        if (toggle) {
            const icon = toggle.querySelector('i');
            icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        localStorage.setItem('mcrh-theme', theme);
    }
    (function initTheme() {
        applyTheme(localStorage.getItem('mcrh-theme') || 'light');
    })();
    document.getElementById('themeToggle')?.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ============ SIDEBAR ============
    window.toggleSidebarCollapse = function() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
        localStorage.setItem('mcrh-sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
    };
    (function initSidebar() {
        if (localStorage.getItem('mcrh-sidebar-collapsed') === '1' && window.innerWidth > 1024) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
    })();
    window.toggleSidebar = function() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarBackdrop').classList.toggle('show');
    };
    window.closeSidebar = function() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarBackdrop').classList.remove('show');
    };

    // ============ RIPPLE ============
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn');
        if (!btn || btn.disabled) return;
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 650);
    });

    // ============ FIREBASE ============
    const firebaseConfig = {
        apiKey: "AIzaSyDnsz1s-VnewbUszXNJptcdMZ_h0QsNHYQ",
        authDomain: "moivoibiomed.firebaseapp.com",
        databaseURL: "https://moivoibiomed-default-rtdb.firebaseio.com",
        projectId: "moivoibiomed",
        storageBucket: "moivoibiomed.firebasestorage.app",
        messagingSenderId: "996551978571",
        appId: "1:996551978571:web:f44941649a58e020f5e7ce"
    };

    import { initializeApp } from 'firebase/app';
    import { getAuth, signOut, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, getDocs, doc, getDoc } from 'firebase/firestore';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const DEEPSEEK_API_KEY = 'sk-12991bbf6fae4d2a865398f29b8f9381';
    let currentJobCards = [];

    // ============ TOAST ============
    let toastTimer = null;
    window.showToast = function(message, type = 'success', title = null) {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toastIcon');
        const types = {
            success: { icon:'fa-check-circle', title: title || 'Success' },
            error: { icon:'fa-times-circle', title: title || 'Error' },
            warning: { icon:'fa-exclamation-triangle', title: title || 'Warning' },
            info: { icon:'fa-info-circle', title: title || 'Info' }
        };
        const t = types[type] || types.info;
        toast.className = 'toast ' + type;
        icon.innerHTML = `<i class="fas ${t.icon}"></i>`;
        document.getElementById('toastTitle').textContent = t.title;
        document.getElementById('toastMessage').textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
    };
    window.hideToast = function() { document.getElementById('toast').classList.remove('show'); };

    window.logout = function() { signOut(auth).then(() => navigateTo('login.html')); };

    // ============ GENERATE REPORT ============
    window.generateReport = async function() {
        const month = document.getElementById('reportMonth').value;
        if (!month) { showToast('Please select a month.', 'warning'); return; }

        // Skeleton
        document.getElementById('summaryStats').innerHTML =
            Array(5).fill('<div class="stat-tile skeleton-tile skeleton"></div>').join('');
        document.getElementById('jobCardsList').innerHTML =
            Array(4).fill('<div class="skeleton-item skeleton"></div>').join('');

        const [year, mon] = month.split('-');
        const start = new Date(year, mon-1, 1);
        const end = new Date(year, mon, 0);
        try {
            const snap = await getDocs(collection(db, 'jobcards'));
            const all = [];
            snap.forEach(doc => { all.push({ id: doc.id, ...doc.data() }); });
            const filtered = all.filter(j => {
                const d = j.updatedAt ? new Date(j.updatedAt) : new Date(j.createdAt);
                return d >= start && d <= end;
            });
            currentJobCards = filtered;
            renderReport(filtered);
        } catch (err) {
            showToast('Error: ' + err.message, 'error');
            document.getElementById('summaryStats').innerHTML = '';
            document.getElementById('jobCardsList').innerHTML =
                '<div class="empty"><i class="fas fa-exclamation-triangle"></i>Could not load data.</div>';
        }
    };

    function renderReport(data) {
        const total = data.length;
        const completed = data.filter(j => j.status === 'Completed').length;
        const pending = data.filter(j => j.status === 'Pending' || j.status === 'Postponed').length;
        const writtenOff = data.filter(j => j.status === 'Written Off').length;
        const withTimes = data.filter(j => j.startDateTime && j.endDateTime);
        const avgTime = withTimes.length
            ? withTimes.reduce((acc, j) => acc + (new Date(j.endDateTime) - new Date(j.startDateTime)) / (1000*60*60*24), 0) / withTimes.length
            : 0;

        document.getElementById('summaryStats').innerHTML = `
            <div class="stat-tile"><div class="value">${total}</div><div class="label">Total Jobs</div></div>
            <div class="stat-tile success"><div class="value">${completed}</div><div class="label">Completed</div></div>
            <div class="stat-tile warning"><div class="value">${pending}</div><div class="label">Pending</div></div>
            <div class="stat-tile danger"><div class="value">${writtenOff}</div><div class="label">Written Off</div></div>
            <div class="stat-tile info"><div class="value">${avgTime.toFixed(1)}</div><div class="label">Avg Days</div></div>
        `;

        if (!data.length) {
            document.getElementById('jobCardsList').innerHTML =
                '<div class="empty"><i class="fas fa-inbox"></i>No job cards for this month.</div>';
            return;
        }
        let html = '<h3>Job Cards</h3>';
        data.forEach(j => {
            const statusClass = (j.status || 'pending').toLowerCase().replace(/\s/g, '');
            html += `
                <div class="job-item">
                    <div class="row">
                        <strong>${j.jobNo || 'N/A'}</strong>
                        <span class="status-badge ${statusClass}">${j.status || 'Pending'}</span>
                    </div>
                    <div class="meta"><i class="fas fa-tools"></i> ${j.equipName || 'N/A'} &nbsp;·&nbsp; <i class="fas fa-map-marker-alt"></i> ${j.unit || 'N/A'}</div>
                    <div class="meta"><i class="fas fa-user"></i> ${j.techName || 'N/A'} &nbsp;·&nbsp; <i class="fas fa-calendar"></i> ${j.updatedAt ? new Date(j.updatedAt).toLocaleDateString() : 'N/A'}</div>
                </div>
            `;
        });
        document.getElementById('jobCardsList').innerHTML = html;
    }

    // ============ AI REPORT ============
    window.generateAIReport = async function() {
        const container = document.getElementById('aiReportContainer');
        container.classList.remove('hidden');
        const aiText = document.getElementById('aiText');
        aiText.textContent = 'Generating AI summary…';
        const data = currentJobCards;
        if (!data || data.length === 0) {
            aiText.textContent = 'No data. Please generate a report first.';
            return;
        }
        let apiKey = DEEPSEEK_API_KEY;
        if (!apiKey || apiKey === 'YOUR_DEEPSEEK_API_KEY') {
            aiText.textContent = '⚠️ AI summary requires a DeepSeek API key.';
            return;
        }
        const prompt = `You are a maintenance reporting assistant. Based on the following job card data for a hospital for the selected month, generate a concise executive summary highlighting key insights, trends, and recommendations.\n\nData: ${JSON.stringify(data, null, 2)}\n\nSummary:`;
        try {
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method:'POST',
                headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}` },
                body: JSON.stringify({ model:'deepseek-chat', messages:[{ role:'user', content:prompt }], temperature:0.7, max_tokens:500 })
            });
            if (!response.ok) throw new Error(`API error ${response.status}`);
            const result = await response.json();
            aiText.textContent = result.choices[0].message.content;
            showToast('AI summary generated', 'success', 'Done');
        } catch (err) {
            aiText.textContent = 'AI summary failed. Check your API key.';
            showToast('AI error: ' + err.message, 'error');
        }
    };

    // ============ EXPORT PDF ============
    window.exportPDF = function() {
        showToast('Generating PDF…', 'info', 'Please wait');
        const el = document.getElementById('reportContent');
        html2canvas(el, {
            scale:2, useCORS:true,
            backgroundColor: document.documentElement.getAttribute('data-theme') === 'dark' ? '#0b1220' : '#f4f6fb'
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p','mm','a4');
            const imgWidth = 210;
            const imgHeight = canvas.height * imgWidth / canvas.width;
            pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
            pdf.save('monthly_report.pdf');
            showToast('PDF downloaded successfully', 'success', 'Done');
        }).catch(err => showToast('Error: ' + err.message, 'error'));
    };

    // ============ AUTH ============
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        try {
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (!userDoc.exists()) { await signOut(auth); window.location.href = 'login.html'; return; }
            const userData = userDoc.data();
            if (!userData.approved) { await signOut(auth); window.location.href = 'login.html'; return; }
            const role = userData.role || 'requester';
            if (role !== 'maintenance' && role !== 'admin') {
                alert('Access denied.');
                window.location.href = 'dashboard.html';
                return;
            }
            document.getElementById('sidebarUserName').textContent = userData.name || 'User';
            document.getElementById('sidebarUserRole').textContent = role;
            document.getElementById('avatarInitial').textContent = (userData.name || 'U').charAt(0).toUpperCase();

            const now = new Date();
            document.getElementById('reportMonth').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
            setTimeout(generateReport, 400);
        } catch (err) { console.error(err); }
    });

    // ============ SHORTCUTS ============
    document.addEventListener('keydown', (e) => {
        const tag = e.target.tagName;
        const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
        if (isTyping) return;
        if (e.key === 'Escape') closeSidebar();
        if (e.key.toLowerCase() === 'r' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); generateReport(); }
    });
</script>
</body>
</html>
