<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCRH - Monthly Report</title>

    <!-- Firebase v9 -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
            }
        }
    </script>

    <!-- jsPDF & html2canvas for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', sans-serif; background:#f4f6f9; padding:20px; }
        .container { max-width:1000px; margin:0 auto; background:white; padding:24px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
        .header h1 { color:#C8102E; }
        .header .user-info { font-size:14px; font-weight:500; }
        .header .user-info .role-tag { font-weight:400; color:#6c757d; }
        .btn { padding:8px 18px; border:none; border-radius:6px; font-weight:600; cursor:pointer; transition:0.2s; }
        .btn-primary { background:#C8102E; color:white; }
        .btn-primary:hover { background:#a00d24; }
        .btn-outline { background:transparent; border:1.5px solid #6c757d; color:#6c757d; }
        .btn-outline:hover { background:#6c757d; color:white; }
        .btn-success { background:#28a745; color:white; }
        .btn-success:hover { background:#1e7e34; }
        .btn-logout { background:#6c757d; color:white; padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:600; transition:0.2s; }
        .btn-logout:hover { background:#5a6268; }
        .filter-bar { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:end; }
        .filter-bar label { font-weight:600; }
        .filter-bar input { padding:8px 14px; border:1px solid #ced4da; border-radius:6px; }
        .summary-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
        .summary-stat { background:#f8f9fc; padding:12px; border-radius:6px; text-align:center; }
        .summary-stat .number { font-size:24px; font-weight:700; }
        .job-card-item { border:1px solid #e9ecef; padding:12px; margin-bottom:8px; border-radius:6px; }
        .job-card-item .row { display:flex; justify-content:space-between; }
        .status-badge { padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; display:inline-block; }
        .status-badge.pending { background:#ffc107; color:#1e2a3a; }
        .status-badge.completed { background:#28a745; color:white; }
        .status-badge.writtenoff { background:#dc3545; color:white; }
        .ai-report { background:#f8f9fc; padding:16px; border-radius:6px; margin-top:20px; border-left:4px solid #C8102E; }
        .ai-report h3 { color:#C8102E; margin-bottom:8px; }
        .hidden { display:none; }
        .toast { position:fixed; top:20px; right:20px; background:#1e2a3a; color:white; padding:14px 28px; border-radius:8px; font-weight:500; z-index:999; transform:translateY(-20px); opacity:0; transition:0.3s; border-left:6px solid #C8102E; max-width:380px; }
        .toast.show { transform:translateY(0); opacity:1; }
        @media (max-width:768px) { .header { flex-direction:column; align-items:stretch; } .filter-bar { flex-direction:column; align-items:stretch; } .filter-bar input { width:100%; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>📄 Monthly Report</h1>
            </div>
            <div>
                <span class="user-info" id="userDisplay">Loading...</span>
                <button class="btn-logout" onclick="logout()" style="margin-left:8px;"><i class="fas fa-sign-out-alt"></i> Logout</button>
                <button class="btn btn-outline" onclick="window.location.href='dashboard.html'" style="margin-left:8px;"><i class="fas fa-arrow-left"></i> Back</button>
                <button class="btn btn-success" onclick="exportPDF()" style="margin-left:8px;"><i class="fas fa-file-pdf"></i> Export PDF</button>
            </div>
        </div>

        <div class="filter-bar">
            <label>Month: <input type="month" id="reportMonth" /></label>
            <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
            <button class="btn btn-outline" id="aiBtn" onclick="generateAIReport()"><i class="fas fa-robot"></i> AI Summary</button>
        </div>

        <div id="reportContent">
            <div class="summary-stats" id="summaryStats"></div>
            <div id="jobCardsList"></div>
            <div id="aiReportContainer" class="ai-report hidden">
                <h3>🤖 AI‑Generated Summary</h3>
                <div id="aiText">Loading...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Message</div>

    <script type="module">
        // ============================================================
        // FIREBASE CONFIG (REPLACE WITH YOUR OWN)
        // ============================================================
       const firebaseConfig = {
  apiKey: "AIzaSyDnsz1s-VnewbUszXNJptcdMZ_h0QsNHYQ",
  authDomain: "moivoibiomed.firebaseapp.com",
  databaseURL: "https://moivoibiomed-default-rtdb.firebaseio.com",
  projectId: "moivoibiomed",
  storageBucket: "moivoibiomed.firebasestorage.app",
  messagingSenderId: "996551978571",
  appId: "1:996551978571:web:f44941649a58e020f5e7ce"
};

        import { initializeApp } from 'firebase/app';
        import { getAuth, signOut, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, getDocs, doc, getDoc, query, where } from 'firebase/firestore';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userDisplay = document.getElementById('userDisplay');
        let currentJobCards = [];

        // ============================================================
        // DEEPSEEK API KEY – REPLACE THE PLACEHOLDER WITH YOUR ACTUAL KEY
        // ============================================================
        // Get your API key from: https://platform.deepseek.com/
        // Paste it between the quotes below.
        const DEEPSEEK_API_KEY = 'sk-12991bbf6fae4d2a865398f29b8f9381'; // <-- PASTE YOUR KEY HERE

        // Optional: If you want to enter the key dynamically via a prompt when missing,
        // you can uncomment the following lines in the generateAIReport function.

        // ===== TOAST =====
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.borderLeftColor = isError ? '#dc3545' : '#C8102E';
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ===== LOGOUT =====
        window.logout = function() {
            signOut(auth).then(() => window.location.href = 'login.html')
                .catch(err => showToast('Logout error: ' + err.message, true));
        };

        // ===== GENERATE MONTHLY REPORT =====
        window.generateReport = async function() {
            const month = document.getElementById('reportMonth').value;
            if (!month) { showToast('Please select a month.', true); return; }
            const [year, mon] = month.split('-');
            const start = new Date(year, mon-1, 1);
            const end = new Date(year, mon, 0);
            const snap = await getDocs(collection(db, 'jobcards'));
            const all = [];
            snap.forEach(doc => { all.push({ id: doc.id, ...doc.data() }); });
            const filtered = all.filter(j => {
                const d = j.updatedAt ? new Date(j.updatedAt) : new Date(j.createdAt);
                return d >= start && d <= end;
            });
            currentJobCards = filtered;
            renderReport(filtered);
        };

        function renderReport(data) {
            const total = data.length;
            const completed = data.filter(j => j.status === 'Completed').length;
            const pending = data.filter(j => j.status === 'Pending' || j.status === 'Postponed').length;
            const writtenOff = data.filter(j => j.status === 'Written Off').length;
            const avgTime = data.filter(j => j.startDateTime && j.endDateTime).reduce((acc, j) => {
                const diff = (new Date(j.endDateTime) - new Date(j.startDateTime)) / (1000*60*60*24);
                return acc + diff;
            }, 0) / (data.filter(j => j.startDateTime && j.endDateTime).length || 1);

            document.getElementById('summaryStats').innerHTML = `
                <div class="summary-stat"><div class="number">${total}</div><div>Total Jobs</div></div>
                <div class="summary-stat" style="border-left:4px solid #28a745;"><div class="number">${completed}</div><div>Completed</div></div>
                <div class="summary-stat" style="border-left:4px solid #ffc107;"><div class="number">${pending}</div><div>Pending</div></div>
                <div class="summary-stat" style="border-left:4px solid #dc3545;"><div class="number">${writtenOff}</div><div>Written Off</div></div>
                <div class="summary-stat" style="border-left:4px solid #17a2b8;"><div class="number">${avgTime.toFixed(1)}</div><div>Avg Days</div></div>
            `;

            let html = '<h3>Job Cards</h3>';
            data.forEach(j => {
                const statusClass = (j.status || 'pending').toLowerCase();
                html += `
                    <div class="job-card-item">
                        <div class="row"><strong>${j.jobNo}</strong> <span class="status-badge ${statusClass}">${j.status || 'Pending'}</span></div>
                        <div>Equipment: ${j.equipName} | Unit: ${j.unit}</div>
                        <div>Technician: ${j.techName || 'N/A'}</div>
                        <div>Date: ${j.updatedAt ? new Date(j.updatedAt).toLocaleDateString() : 'N/A'}</div>
                    </div>
                `;
            });
            document.getElementById('jobCardsList').innerHTML = html || '<p>No job cards for this month.</p>';
        }

        // ============================================================
        // DEEPSEEK AI INTEGRATION – WITH KEY CHECK & FALLBACK
        // ============================================================
        window.generateAIReport = async function() {
            const container = document.getElementById('aiReportContainer');
            container.classList.remove('hidden');
            const aiText = document.getElementById('aiText');
            aiText.textContent = 'Generating AI summary...';

            const data = currentJobCards;
            if (!data || data.length === 0) {
                aiText.textContent = 'No data to generate a summary. Please generate a report first.';
                return;
            }

            // Check if API key is missing or placeholder
            let apiKey = DEEPSEEK_API_KEY;
            if (!apiKey || apiKey === 'YOUR_DEEPSEEK_API_KEY') {
                // Optionally, prompt user to enter key dynamically (useful for testing)
                const userKey = prompt('DeepSeek API key is missing. Please enter your API key (or cancel to skip):');
                if (userKey && userKey.trim() !== '') {
                    apiKey = userKey.trim();
                } else {
                    aiText.textContent = '⚠️ AI summary requires a DeepSeek API key. Please add your key in the file (DEEPSEEK_API_KEY) or enter it now.';
                    showToast('No API key provided', true);
                    return;
                }
            }

            // Build a prompt for DeepSeek
            const prompt = `
You are a maintenance reporting assistant. Based on the following job card data for a hospital for the selected month, generate a concise executive summary highlighting key insights, trends, and recommendations.

Data: ${JSON.stringify(data, null, 2)}

Summary:
`;

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API request failed: ${response.status} ${errText}`);
                }
                const result = await response.json();
                const summary = result.choices[0].message.content;
                aiText.textContent = summary;
                showToast('✅ AI summary generated.');
            } catch (err) {
                console.error(err);
                aiText.textContent = 'AI summary generation failed. Check your API key or try again later.';
                showToast('AI error: ' + err.message, true);
            }
        };

        // ===== EXPORT PDF =====
        window.exportPDF = function() {
            showToast('Generating PDF...');
            const element = document.getElementById('reportContent');
            html2canvas(element, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgWidth = 210;
                const imgHeight = canvas.height * imgWidth / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                pdf.save('monthly_report.pdf');
                showToast('✅ PDF downloaded.');
            }).catch(err => {
                showToast('Error generating PDF: ' + err.message, true);
            });
        };

        // ============================================================
        // AUTH & APPROVAL CHECK
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (!userDoc.exists()) {
                    showToast('User profile not found. Please contact admin.', true);
                    await signOut(auth);
                    window.location.href = 'login.html';
                    return;
                }
                const userData = userDoc.data();
                if (!userData.approved) {
                    showToast('Your account is pending approval. Please wait for admin.', true);
                    await signOut(auth);
                    window.location.href = 'login.html';
                    return;
                }

                // Only maintenance and admin can view reports
                const role = userData.role || 'requester';
                if (role !== 'maintenance' && role !== 'admin') {
                    alert('Access denied. You do not have permission to view reports.');
                    window.location.href = 'dashboard.html';
                    return;
                }

                // Display user info
                userDisplay.textContent = `${userData.name || 'User'} (${role})`;

                // Set default month to current and auto-generate
                const now = new Date();
                document.getElementById('reportMonth').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
                setTimeout(generateReport, 500);

            } catch (err) {
                console.error(err);
                showToast('Error loading profile: ' + err.message, true);
            }
        });
    </script>
</body>
</html>
