<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCRH - Analytics</title>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary:#C8102E; --primary-gradient:linear-gradient(135deg,#C8102E 0%,#e81a3f 100%);
            --bg:#f4f6fb; --card:#fff; --border:#e8ebf1; --border-soft:#f1f4f9;
            --text:#0f172a; --text-soft:#475569; --text-muted:#94a3b8;
            --radius:14px; --radius-sm:10px;
            --shadow-sm:0 1px 3px rgba(15,23,42,0.04);
            --shadow:0 4px 14px rgba(15,23,42,0.06);
            --transition:200ms cubic-bezier(0.4,0,0.2,1);
            --sidebar-width:240px;
        }
        body {
            font-family:'Plus Jakarta Sans','Inter',sans-serif;
            background:var(--bg);
            color:var(--text);
            -webkit-font-smoothing:antialiased;
        }
        .app-shell { display:flex; min-height:100vh; }

        /* Sidebar */
        .sidebar {
            width:var(--sidebar-width);
            background:linear-gradient(180deg,#1a1a2e 0%,#0f172a 100%);
            color:white;
            display:flex;
            flex-direction:column;
            position:fixed;
            top:0; left:0; bottom:0;
            z-index:100;
            overflow:hidden;
        }
        .sidebar-header {
            padding:20px 18px;
            border-bottom:1px solid rgba(255,255,255,0.08);
            display:flex;
            align-items:center;
            gap:12px;
        }
        .sidebar-logo {
            width:38px; height:38px;
            background:var(--primary-gradient);
            border-radius:10px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:800;
            font-size:17px;
            box-shadow:0 4px 12px rgba(200,16,46,0.4);
        }
        .sidebar-title { font-weight:700; font-size:14px; line-height:1.2; }
        .sidebar-title small { font-size:10.5px; color:rgba(255,255,255,0.5); font-weight:500; display:block; }

        .sidebar-nav {
            flex:1;
            padding:14px 10px;
            display:flex;
            flex-direction:column;
            gap:4px;
            overflow-y:auto;
        }
        .nav-section-title {
            font-size:10px;
            text-transform:uppercase;
            letter-spacing:0.8px;
            color:rgba(255,255,255,0.4);
            padding:10px 12px 6px;
            font-weight:700;
        }
        .nav-item {
            display:flex;
            align-items:center;
            gap:12px;
            padding:11px 14px;
            border-radius:10px;
            color:rgba(255,255,255,0.75);
            cursor:pointer;
            font-size:13.5px;
            font-weight:600;
            transition:var(--transition);
            border:none;
            background:transparent;
            width:100%;
            text-align:left;
            font-family:inherit;
            text-decoration:none;
        }
        .nav-item i { font-size:15px; width:20px; text-align:center; }
        .nav-item:hover { background:rgba(255,255,255,0.06); color:white; }
        .nav-item.active { background:var(--primary-gradient); color:white; box-shadow:0 4px 12px rgba(200,16,46,0.35); }

        .sidebar-footer {
            padding:14px 10px;
            border-top:1px solid rgba(255,255,255,0.08);
        }
        .user-chip {
            display:flex;
            align-items:center;
            gap:10px;
            padding:10px 12px;
            border-radius:10px;
            background:rgba(255,255,255,0.05);
            margin-bottom:8px;
        }
        .user-avatar {
            width:34px; height:34px;
            border-radius:50%;
            background:var(--primary-gradient);
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:700;
            font-size:13px;
        }
        .user-chip-info { flex:1; min-width:0; }
        .user-chip-info .name { font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .user-chip-info .role { font-size:10px; color:rgba(255,255,255,0.55); text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }

        /* Main area */
        .main-area { flex:1; margin-left:var(--sidebar-width); display:flex; flex-direction:column; }

        .topbar {
            background:white;
            border-bottom:1px solid var(--border);
            padding:14px 24px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:16px;
            position:sticky;
            top:0;
            z-index:50;
            box-shadow:var(--shadow-sm);
        }
        .topbar-left { display:flex; align-items:center; gap:14px; }
        .menu-toggle {
            display:none;
            background:var(--bg);
            border:1px solid var(--border);
            width:38px; height:38px;
            border-radius:10px;
            cursor:pointer;
            color:var(--text);
            font-size:15px;
        }
        .page-title h1 { font-size:18px; font-weight:800; letter-spacing:-0.3px; }
        .page-title small { font-size:12px; color:var(--text-muted); font-weight:500; }

        .btn {
            padding:9px 16px;
            border:none;
            border-radius:10px;
            font-weight:700;
            font-size:12.5px;
            cursor:pointer;
            transition:var(--transition);
            display:inline-flex;
            align-items:center;
            gap:7px;
            font-family:inherit;
            text-decoration:none;
            white-space:nowrap;
        }
        .btn i { font-size:12px; }
        .btn-primary { background:var(--primary-gradient); color:white; box-shadow:0 4px 12px rgba(200,16,46,0.28); }
        .btn-primary:hover { transform:translateY(-1px); }
        .btn-success { background:linear-gradient(135deg,#10b981,#22c55e); color:white; }
        .btn-success:hover { transform:translateY(-1px); }
        .btn-outline { background:white; border:1.5px solid var(--border); color:var(--text-soft); }
        .btn-outline:hover { border-color:var(--primary); color:var(--primary); background:#fff5f6; }
        .btn-sm { padding:8px 14px; font-size:12px; }

        .content { padding:20px 24px 40px; flex:1; }

        /* Filters */
        .filter-card {
            background:white;
            border-radius:var(--radius);
            padding:16px 20px;
            border:1px solid var(--border);
            box-shadow:var(--shadow-sm);
            margin-bottom:18px;
            display:flex;
            flex-wrap:wrap;
            gap:14px;
            align-items:end;
        }
        .filter-field { display:flex; flex-direction:column; gap:6px; }
        .filter-field label {
            font-size:11px;
            font-weight:700;
            color:var(--text-soft);
            text-transform:uppercase;
            letter-spacing:0.4px;
        }
        .filter-field input {
            padding:10px 14px;
            border:1.5px solid var(--border);
            border-radius:10px;
            font-size:13px;
            font-family:inherit;
            background:#fafbfd;
            outline:none;
            font-weight:500;
            color:var(--text);
            transition:var(--transition);
        }
        .filter-field input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(200,16,46,0.08); background:white; }

        /* Charts grid */
        .charts-grid {
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:18px;
        }
        .chart-card {
            background:white;
            border-radius:var(--radius);
            border:1px solid var(--border);
            box-shadow:var(--shadow-sm);
            padding:20px 22px;
            transition:var(--transition);
        }
        .chart-card:hover { box-shadow:var(--shadow); }
        .chart-card h3 {
            font-size:13px;
            font-weight:700;
            margin-bottom:14px;
            color:var(--text);
            display:flex;
            align-items:center;
            gap:9px;
            text-transform:uppercase;
            letter-spacing:0.3px;
        }
        .chart-card h3::before {
            content:'';
            width:6px; height:6px;
            background:var(--primary);
            border-radius:50%;
        }
        .chart-card canvas { max-height:230px; width:100% !important; }

        .toast {
            position:fixed;
            bottom:24px; right:24px;
            background:#0f172a;
            color:white;
            padding:14px 22px;
            border-radius:12px;
            font-weight:700;
            z-index:9999;
            transform:translateY(100px);
            opacity:0;
            transition:320ms cubic-bezier(0.4,0,0.2,1);
            border-left:4px solid var(--primary);
            max-width:360px;
            box-shadow:0 16px 48px rgba(15,23,42,0.3);
            font-size:13px;
        }
        .toast.show { transform:translateY(0); opacity:1; }

        .sidebar-backdrop {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(15,23,42,0.5);
            z-index:99;
            opacity:0;
            transition:opacity var(--transition);
        }

        @media (max-width:1024px) {
            .sidebar { transform:translateX(-100%); transition:transform var(--transition); }
            .sidebar.open { transform:translateX(0); }
            .main-area { margin-left:0; }
            .menu-toggle { display:flex; align-items:center; justify-content:center; }
            .sidebar-backdrop.show { display:block; opacity:1; }
            .charts-grid { grid-template-columns:1fr; }
        }
        @media (max-width:640px) {
            .content { padding:16px; }
            .topbar { padding:12px 16px; }
            .topbar-actions .btn span { display:none; }
        }
    </style>
</head>
<body>

<div class="app-shell">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">M</div>
            <div class="sidebar-title">MCRH<small>Maintenance</small></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Overview</div>
            <a class="nav-item" href="dashboard.html"><i class="fas fa-clipboard-list"></i><span>Requests</span></a>
            <a class="nav-item" href="dashboard.html"><i class="fas fa-tools"></i><span>Jobcards</span></a>
            <div class="nav-section-title">Reports</div>
            <a class="nav-item active" href="analytics.html"><i class="fas fa-chart-bar"></i><span>Analytics</span></a>
            <a class="nav-item" href="report.html"><i class="fas fa-file-alt"></i><span>Monthly Report</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-chip">
                <div class="user-avatar" id="avatarInitial">U</div>
                <div class="user-chip-info">
                    <div class="name" id="sidebarUserName">User</div>
                    <div class="role" id="sidebarUserRole">role</div>
                </div>
            </div>
            <button class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
        </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <div class="main-area">
        <div class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div class="page-title">
                    <h1>Analytics</h1>
                    <small>Performance insights &amp; trends</small>
                </div>
            </div>
            <div class="topbar-actions" style="display:flex;gap:8px;">
                <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-left"></i> <span>Back</span></button>
                <button class="btn btn-success btn-sm" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> <span>Export PDF</span></button>
            </div>
        </div>

        <div class="content">
            <div class="filter-card">
                <div class="filter-field">
                    <label>From</label>
                    <input type="date" id="fromDate" />
                </div>
                <div class="filter-field">
                    <label>To</label>
                    <input type="date" id="toDate" />
                </div>
                <button class="btn btn-primary" onclick="applyDateFilter()"><i class="fas fa-filter"></i> Apply</button>
            </div>

            <div class="charts-grid">
                <div class="chart-card"><h3>Jobs per Month</h3><canvas id="monthlyChart"></canvas></div>
                <div class="chart-card"><h3>Failure Reasons</h3><canvas id="failureChart"></canvas></div>
                <div class="chart-card"><h3>Status Breakdown</h3><canvas id="statusChart"></canvas></div>
                <div class="chart-card"><h3>Average Completion Time (Days)</h3><canvas id="timeChart"></canvas></div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast">Message</div>

<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyDnsz1s-VnewbUszXNJptcdMZ_h0QsNHYQ",
        authDomain: "moivoibiomed.firebaseapp.com",
        databaseURL: "https://moivoibiomed-default-rtdb.firebaseio.com",
        projectId: "moivoibiomed",
        storageBucket: "moivoibiomed.firebasestorage.app",
        messagingSenderId: "996551978571",
        appId: "1:996551978571:web:f44941649a58e020f5e7ce"
    };

    import { initializeApp } from 'firebase/app';
    import { getAuth, signOut, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy } from 'firebase/firestore';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allJobCards = [];
    let chartInstances = {};

    window.toggleSidebar = function() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarBackdrop').classList.toggle('show');
    };
    window.closeSidebar = function() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarBackdrop').classList.remove('show');
    };

    function showToast(msg, isError = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.borderLeftColor = isError ? '#ef4444' : '#C8102E';
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    window.logout = function() {
        signOut(auth).then(() => window.location.href = 'login.html');
    };

    async function fetchJobCards() {
        try {
            const snap = await getDocs(query(collection(db, 'jobcards'), orderBy('updatedAt', 'desc')));
            allJobCards = [];
            snap.forEach(doc => { allJobCards.push({ id: doc.id, ...doc.data() }); });
        } catch (err) {
            showToast('Error fetching jobcards: ' + err.message, true);
        }
    }

    function filterByDate(from, to) {
        return allJobCards.filter(j => {
            const d = j.updatedAt ? new Date(j.updatedAt) : new Date(j.createdAt);
            return (!from || d >= new Date(from)) && (!to || d <= new Date(to));
        });
    }

    function renderCharts(data) {
        Object.values(chartInstances).forEach(c => c.destroy());
        chartInstances = {};

        const months = {};
        data.forEach(j => {
            const d = j.updatedAt ? new Date(j.updatedAt) : new Date(j.createdAt);
            const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
            months[key] = (months[key] || 0) + 1;
        });
        const labels = Object.keys(months).sort();
        const values = labels.map(l => months[l]);
        chartInstances.monthly = new Chart(document.getElementById('monthlyChart'), {
            type:'bar',
            data:{ labels, datasets:[{ label:'Jobs', data:values, backgroundColor:'#C8102E', borderRadius:6 }] },
            options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1, font:{ size:10 } }, grid:{ color:'#f1f5f9', drawBorder:false } }, x:{ grid:{ display:false }, ticks:{ font:{ size:10 } } } } }
        });

        const failures = {};
        data.forEach(j => { if (j.writeOffReason) failures[j.writeOffReason] = (failures[j.writeOffReason] || 0) + 1; });
        chartInstances.failure = new Chart(document.getElementById('failureChart'), {
            type:'pie',
            data:{ labels:Object.keys(failures), datasets:[{ data:Object.values(failures), backgroundColor:['#C8102E','#f59e0b','#10b981','#0ea5e9','#8b5cf6'] }] },
            options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, padding:10, font:{ size:10 } } } } }
        });

        const statusCounts = { Pending:0, Completed:0, 'Written Off':0 };
        data.forEach(j => {
            const s = j.status || 'Pending';
            statusCounts[s] = (statusCounts[s] || 0) + 1;
        });
        chartInstances.status = new Chart(document.getElementById('statusChart'), {
            type:'doughnut',
            data:{ labels:Object.keys(statusCounts), datasets:[{ data:Object.values(statusCounts), backgroundColor:['#f59e0b','#10b981','#ef4444'], borderWidth:2, borderColor:'#fff' }] },
            options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, padding:10, font:{ size:10 } } } } }
        });

        const timeData = {};
        data.forEach(j => {
            if (j.startDateTime && j.endDateTime) {
                const start = new Date(j.startDateTime);
                const end = new Date(j.endDateTime);
                const diff = (end - start) / (1000*60*60*24);
                if (diff > 0) {
                    const key = start.getFullYear() + '-' + String(start.getMonth()+1).padStart(2,'0');
                    if (!timeData[key]) timeData[key] = { total:0, count:0 };
                    timeData[key].total += diff;
                    timeData[key].count++;
                }
            }
        });
        const labels4 = Object.keys(timeData).sort();
        const values4 = labels4.map(l => (timeData[l].total / timeData[l].count).toFixed(1));
        chartInstances.time = new Chart(document.getElementById('timeChart'), {
            type:'line',
            data:{ labels:labels4, datasets:[{ label:'Avg Days', data:values4, borderColor:'#C8102E', backgroundColor:'rgba(200,16,46,0.08)', fill:true, tension:0.4, pointBackgroundColor:'#C8102E', pointBorderColor:'#fff', pointBorderWidth:2, pointRadius:4 }] },
            options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ font:{ size:10 } }, grid:{ color:'#f1f5f9', drawBorder:false } }, x:{ grid:{ display:false }, ticks:{ font:{ size:10 } } } } }
        });
    }

    window.applyDateFilter = function() {
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;
        renderCharts(filterByDate(from, to));
    };

    window.exportPDF = function() {
        showToast('Generating PDF...');
        const el = document.querySelector('.content');
        html2canvas(el, { scale:2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p','mm','a4');
            const imgWidth = 210;
            const imgHeight = canvas.height * imgWidth / canvas.width;
            pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
            pdf.save('analytics_report.pdf');
            showToast('✅ PDF downloaded.');
        }).catch(err => showToast('Error: ' + err.message, true));
    };

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        try {
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (!userDoc.exists()) { await signOut(auth); window.location.href = 'login.html'; return; }
            const userData = userDoc.data();
            if (!userData.approved) { await signOut(auth); window.location.href = 'login.html'; return; }
            const role = userData.role || 'requester';
            if (role !== 'maintenance' && role !== 'admin') {
                alert('Access denied.');
                window.location.href = 'dashboard.html';
                return;
            }
            document.getElementById('sidebarUserName').textContent = userData.name || 'User';
            document.getElementById('sidebarUserRole').textContent = role;
            document.getElementById('avatarInitial').textContent = (userData.name || 'U').charAt(0).toUpperCase();

            await fetchJobCards();
            const now = new Date();
            const oneYearAgo = new Date(now.getFullYear()-1, now.getMonth(), now.getDate());
            document.getElementById('fromDate').value = oneYearAgo.toISOString().split('T')[0];
            document.getElementById('toDate').value = now.toISOString().split('T')[0];
            applyDateFilter();
        } catch (err) { console.error(err); }
    });
</script>
</body>
</html>
